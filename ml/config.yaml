# Parkinson's Multimodal ML — default configuration.
# Override any value with an environment variable, e.g. PARK_ML_DATA_DIR=D:/data
# or by copying this file to ml/config.local.yaml (never committed).

data_dir: Parkinson
voice:
  path: Voice/parkinsons.data
handwriting:
  spiral_path: "Handwriting/archive (7)/Spiral_HandPD.csv"
  meander_path: "Handwriting/archive (7)/Meander_HandPD.csv"
gait:
  path: Gait/gait-in-parkinsons-disease-1.0.0/gait-in-parkinsons-disease-1.0.0
artifacts_dir: artifacts
metrics_dir: metrics
seed: 42
cv:
  voice_folds: 5
  handwriting_folds: 5
  gait_folds: 5
fusion:
  weights:            # starting weights for weighted soft voting
    voice: 0.35
    handwriting: 0.35
    gait: 0.30
  stacking_C: 1.0
tabnet:
  n_d: 16
  n_a: 16
  n_steps: 4
  gamma: 1.5
  n_independent: 2
  n_shared: 2
  lambda_sparse: 0.001
  seed: 42
